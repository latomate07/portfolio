name: CD

on:
  push:
    branches: [master]
    paths-ignore:
      - "terraform/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC -> AWS role assumption

concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to S3 / CloudFront
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Debug role ARN length
        run: echo -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" | wc -c

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync build to S3
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET_NAME }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET_NAME }}/index.html" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
